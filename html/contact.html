<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Département Informatique EFREI</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .contact-form label { display: block; margin: 15px 0 5px; font-weight: bold; color: #333; }
        .contact-form input[type="text"],
        .contact-form input[type="email"],
        .contact-form textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .contact-form input:focus, .contact-form textarea:focus {
            outline: none;
            border-color: #729fcf;
        }
        .contact-form button {
            background-color: #729fcf;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 20px;
            transition: background-color 0.2s;
        }
        .contact-form button:hover {
            background-color: #5a8cc2;
        }
    </style>
</head>
<body>

    <header class="header-banner">
        <h1>Efrei - Département Informatique</h1>
    </header>

    <nav class="main-nav">
        <ul>
            <li><a href="acceuil.html">Accueil</a></li>
            <li><a href="cours_et_formation.html">Formations</a></li>
            <li><a href="equipe_enseignante.html">Équipe</a></li>
        </ul>
    </nav>

    <main>
        <section class="content-block">
            <h2>Nous Contacter</h2>
            <p>Pour toute question, demande d'information ou partenariat, veuillez remplir le formulaire ci-dessous.</p>
            <form action="#" method="POST" class="contact-form">
                <label for="name">Nom complet</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Adresse Email</label>
                <input type="email" id="email" name="email" required>
                
                <label for="subject">Objet de votre message</label>
                <input type="text" id="subject" name="subject" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <button type="submit">Envoyer</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Efrei Paris - <a href="apropos.html">À propos de nous</a></p>
    </footer>
    <link rel="stylesheet" href="../css/style.css">
</body>
</html>
