<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Neural Network - Staff Only</title>
    <style>
        body {
            margin: 0;
            background: #0a051a; /* Fond violet très noir */
            color: #bc99ff;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(15, 5, 40, 0.8);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #7a4dff;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(122, 77, 255, 0.3);
        }

        h1 { font-size: 2.5rem; margin: 0; letter-spacing: 3px; color: #dcbfff; }
        p { opacity: 0.7; margin-top: 10px; font-style: italic; }

        .btn-exit {
            margin-top: 25px;
            display: inline-block;
            padding: 10px 25px;
            color: #dcbfff;
            border: 1px dashed #7a4dff;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-exit:hover {
            background: #7a4dff;
            color: white;
            box-shadow: 0 0 20px #7a4dff;
        }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="content">
    <h1>NEURAL BRAIN</h1>
    <p>Accès au réseau de neurones de l'équipe pédagogique.</p>
    <div style="font-size: 0.8rem; margin-top: 10px; color: #7a4dff;">CONNEXION ÉTABLIE...</div>
    <a href="equipe_enseignante.html" class="btn-exit">DÉCONNEXION</a>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particlesArray;

    class Particle {
        constructor(x, y, directionX, directionY, size, color) {
            this.x = x;
            this.y = y;
            this.directionX = directionX;
            this.directionY = directionY;
            this.size = size;
            this.color = color;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
            ctx.fillStyle = '#7a4dff';
            ctx.fill();
        }
        update() {
            if (this.x > canvas.width || this.x < 0) this.directionX = -this.directionX;
            if (this.y > canvas.height || this.y < 0) this.directionY = -this.directionY;
            this.x += this.directionX;
            this.y += this.directionY;
            this.draw();
        }
    }

    function init() {
        particlesArray = [];
        let numberOfParticles = (canvas.height * canvas.width) / 9000;
        for (let i = 0; i < numberOfParticles; i++) {
            let size = (Math.random() * 3) + 1;
            let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
            let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
            let directionX = (Math.random() * 2) - 1;
            let directionY = (Math.random() * 2) - 1;
            let color = '#7a4dff';
            particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
        }
    }

    function connect() {
        for (let a = 0; a < particlesArray.length; a++) {
            for (let b = a; b < particlesArray.length; b++) {
                let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x))
                + ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                if (distance < (canvas.width/7) * (canvas.height/7)) {
                    ctx.strokeStyle = 'rgba(122, 77, 255, 0.1)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                    ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                    ctx.stroke();
                }
            }
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        ctx.clearRect(0,0, innerWidth, innerHeight);
        for (let i = 0; i < particlesArray.length; i++) {
            particlesArray[i].update();
        }
        connect();
    }

    init();
    animate();

    window.addEventListener('resize', () => {
        canvas.width = innerWidth;
        canvas.height = innerHeight;
        init();
    });
</script>

</body>
</html>
