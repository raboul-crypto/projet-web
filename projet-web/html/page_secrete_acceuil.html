<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Core System - EFREI Secret</title>
    <style>
        body {
            margin: 0;
            background: #000510;
            color: #00d4ff;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #canvas-dots {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(0, 10, 30, 0.7);
            padding: 50px;
            border: 1px solid #00d4ff;
            border-radius: 50%; /* Style circulaire pour le "Core" */
            width: 400px;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.4);
            animation: pulse 4s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 30px rgba(0, 212, 255, 0.2); }
            50% { box-shadow: 0 0 70px rgba(0, 212, 255, 0.6); }
            100% { box-shadow: 0 0 30px rgba(0, 212, 255, 0.2); }
        }

        h1 { font-size: 2rem; letter-spacing: 5px; margin: 0; }
        p { font-size: 0.9rem; opacity: 0.8; margin-top: 15px; }

        .btn-exit {
            margin-top: 30px;
            color: #00d4ff;
            text-decoration: none;
            border: 1px solid #00d4ff;
            padding: 10px 20px;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .btn-exit:hover { background: #00d4ff; color: #000510; }
    </style>
</head>
<body>

<canvas id="canvas-dots"></canvas>

<div class="content">
    <h1>CORE SYSTEM</h1>
    <p>Visualisation des flux de données du département.</p>
    <p style="font-size: 0.7rem; color: #fff;">[ STATUS: OPERATIONAL ]</p>
    <a href="acceuil.html" class="btn-exit">DÉCONNEXION</a>
</div>

<script>
    const canvas = document.getElementById('canvas-dots');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];
    const mouse = { x: null, y: null, radius: 150 };

    window.addEventListener('mousemove', (event) => {
        mouse.x = event.x;
        mouse.y = event.y;
    });

    class Particle {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.size = 2;
            this.baseX = this.x;
            this.baseY = this.y;
            this.density = (Math.random() * 30) + 1;
        }
        draw() {
            ctx.fillStyle = '#00d4ff';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.closePath();
            ctx.fill();
        }
        update() {
            let dx = mouse.x - this.x;
            let dy = mouse.y - this.y;
            let distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < mouse.radius) {
                this.x -= dx / 10;
                this.y -= dy / 10;
            } else {
                if (this.x !== this.baseX) {
                    let dx = this.x - this.baseX;
                    this.x -= dx / 20;
                }
                if (this.y !== this.baseY) {
                    let dy = this.y - this.baseY;
                    this.y -= dy / 20;
                }
            }
        }
    }

    function init() {
        particles = [];
        for (let i = 0; i < 500; i++) {
            let x = Math.random() * canvas.width;
            let y = Math.random() * canvas.height;
            particles.push(new Particle(x, y));
        }
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particles.length; i++) {
            particles[i].draw();
            particles[i].update();
        }
        requestAnimationFrame(animate);
    }

    init();
    animate();
</script>

</body>
</html>
