<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Database Leak - EFREI</title>
    <style>
        body {
            background-color: #1a0000; /* Rouge très sombre / Alerte */
            color: #ff4d4d;
            font-family: 'Consolas', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .terminal {
            width: 80%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border: 1px solid #ff4d4d;
            box-shadow: 0 0 30px rgba(255, 77, 77, 0.2);
            position: relative;
        }

        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(255, 77, 77, 0.1);
            position: absolute;
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .glitch {
            font-size: 2rem;
            font-weight: bold;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
        }

        #typewriter {
            margin-top: 20px;
            line-height: 1.6;
            color: #ff9999;
        }

        .btn-return {
            margin-top: 30px;
            color: #ff4d4d;
            border: 1px solid #ff4d4d;
            padding: 10px 20px;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-return:hover {
            background: #ff4d4d;
            color: black;
        }
    </style>
</head>
<body>

    <div class="scanline"></div>

    <div class="terminal">
        <div class="glitch">CONFIDENTIAL_DATA_LEAK</div>
        <div id="typewriter"></div>
        <br>
        <a href="cours_et_formation.html" class="btn-return">QUITTER LA SESSION</a>
    </div>

    <script>
        const text = `
> Initialisation du protocole de récupération...
> Accès serveur : OK
> Extraction des formations classées :
  - Projet X-Neural : IA de prédiction de notes
  - Cyber-Attack V3 : Simulation d'intrusion Efrei
  - Quantum Computing : Module 001 [CLASSIFIÉ]
> ATTENTION : Tentative de traçage détectée...
> Déconnexion recommandée immédiatement.
        `;

        let i = 0;
        const speed = 40;

        function typeWriter() {
            if (i < text.length) {
                document.getElementById("typewriter").innerHTML += text.charAt(i) === '\n' ? '<br>' : text.charAt(i);
                i++;
                setTimeout(typeWriter, speed);
            }
        }

        // On lance l'effet au chargement
        window.onload = typeWriter;
    </script>
</body>
</html>
